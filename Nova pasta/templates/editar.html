{% extends 'base.html' %}
{% block content %}
<h2>Editar Tarefa</h2>
<form method="POST">
    <input name="titulo" value="{{ tarefa.titulo }}" required>

    <select name="status">
        <option value="pendente">Pendente</option>
        <option value="concluida">Concluída</option>
    </select>

    <button type="submit">Salvar</button>
</form>
{% endblock %}
